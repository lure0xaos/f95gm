name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: java -version
      - run: ./gradlew verifyJavaRuntime --no-configuration-cache --console=plain
      - run: ./gradlew verifyToolchainConsistency --no-configuration-cache --console=plain
      - run: ./gradlew verifyArchitecture --no-configuration-cache --console=plain
      - run: ./gradlew jvmTest jsTest check --configuration-cache --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-report
          path: build/generated/api/CHANGELOG.md
      # Detekt analysis currently runs under Java 21 for stable parser/tooling compatibility.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew detekt --no-configuration-cache --console=plain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm audit --audit-level=high
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: ./gradlew browserE2e --no-configuration-cache --console=plain

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: java -version
      - run: .\gradlew.bat verifyJavaRuntime --no-configuration-cache --console=plain
      - run: .\gradlew.bat verifyToolchainConsistency --no-configuration-cache --console=plain
      - run: .\gradlew.bat verifyArchitecture --no-configuration-cache --console=plain
      - run: .\gradlew.bat jvmTest jsTest check :packaging:verifyInstallerInputs :packaging:smokePackagedLauncher -PrunInstallerSmoke=true --configuration-cache --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-report-windows
          path: build/generated/api/CHANGELOG.md
